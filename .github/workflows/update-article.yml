name: Publish Daily Crypto Article

on:
  schedule:
    # 09:00 and 19:00 Asia/Kolkata (03:30 and 13:30 UTC).
    # The script stores both editions under the same calendar date.
    - cron: '30 3,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and archive today's article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_MODEL: openai/gpt-4o-mini
        run: node scripts/update-article.js

      - name: Commit and push article archive
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add todays-article.html articles/
          if git diff --cached --quiet; then
            echo "No article changes detected."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "auto: publish daily crypto article"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Netlify deploy
        if: steps.commit.outputs.pushed == 'true'
        run: curl --fail --silent --show-error -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
