name: Scheduled Crypto Bites Update

on:
  schedule:
    # 08:30, 13:30, 18:30, and 23:30 Asia/Kolkata (03:00, 08:00, 13:00, 18:00 UTC).
    # GitHub Actions may start scheduled jobs a little late.
    - cron: '0 3,8,13,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Update Script
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: node scripts/update-bites.js

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html

          if ! git diff --cached --quiet; then
            git commit -m "auto: update daily crypto bites and timestamp"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in index.html, skipping push."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Netlify Deploy
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
